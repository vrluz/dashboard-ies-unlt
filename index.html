<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard IES — UNLT · N1, N2 e N3</title>
<style>
/* Starian Design System — tokens (colors_and_type.css) */
@font-face{font-family:"Aptos";src:local("Aptos"),url("fonts/Aptos.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Aptos";src:local("Aptos SemiBold"),url("fonts/Aptos-SemiBold.ttf") format("truetype");font-weight:600;font-display:swap}
@font-face{font-family:"Aptos";src:local("Aptos Bold"),url("fonts/Aptos-Bold.ttf") format("truetype");font-weight:700;font-display:swap}
@font-face{font-family:"Aptos Display";src:local("Aptos Display"),url("fonts/Aptos-Display-Bold.ttf") format("truetype");font-weight:700;font-display:swap}
@font-face{font-family:"Aptos Mono";src:local("Aptos Mono"),url("fonts/Aptos-Mono.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Aptos Mono";src:local("Aptos Mono Bold"),url("fonts/Aptos-Mono-Bold.ttf") format("truetype");font-weight:700;font-display:swap}
:root{
  --font-sans:"Aptos",system-ui,"Segoe UI",sans-serif;--font-display:"Aptos Display","Aptos",system-ui,sans-serif;--font-mono:"Aptos Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --bg:#F4F5F6;--panel:#FFFFFF;--fg:#002232;--muted:#62696D;--line:rgba(0,34,50,.12);--chip:#E9ECEE;
  --brand:#002232;--accent:#002232;--accent-fg:#FFFFFF;--accent-hover:#003A55;--link-hover:#2F80ED;
  --ok:#27AE60;--warn:#F4B66B;--bad:#E63946;
  --ok-t:#1B7F44;--warn-t:#8A5A00;--bad-t:#B3202D;
  --okbg:#E6F4EC;--warnbg:#FDF3DF;--badbg:#FBE9EB;
  --shadow-sm:0 2px 6px rgba(0,34,50,.08);--shadow-md:0 8px 20px rgba(0,34,50,.10);
  --verticals:linear-gradient(90deg,#E63946 0%,#F2994A 18%,#F2C94C 35%,#27AE60 55%,#2D9CDB 72%,#2F80ED 88%,#9B51E0 100%);
  --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E0E0E;--panel:#1A1F22;--fg:#FFFFFF;--muted:#B7BCBE;--line:rgba(255,255,255,.14);--chip:#2A3236;
  --brand:#FFFFFF;--accent:#FFFFFF;--accent-fg:#002232;--accent-hover:#D7D7D7;
  --ok-t:#5CD08A;--warn-t:#F4B66B;--bad-t:#F0707B;
  --okbg:#12301F;--warnbg:#3A2E14;--badbg:#3B1A1D;--shadow-sm:none;--shadow-md:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-sans)}
header{position:relative;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 24px 20px;background:#002232;color:#fff}
@media (prefers-color-scheme:dark){header{background:#0E0E0E;border-bottom:1px solid var(--line)}}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--verticals)}
.eyebrow{font:400 11px/1 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:#B7BCBE;margin-bottom:6px}
h1{font:700 22px/1.15 var(--font-display);letter-spacing:-.01em;margin:0;color:#fff}
header .note{color:#B7BCBE;margin:4px 0 0}
header .chip{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22)}
header .chip.ok{background:rgba(39,174,96,.22);color:#9FE5BC}header .chip.warn{background:rgba(244,182,107,.2);color:#F8D27A}header .chip.bad{background:rgba(230,57,70,.25);color:#FFB3B9}
header .btn.ghost{color:#fff;border-color:rgba(255,255,255,.45);background:transparent}
header .btn.ghost:hover{background:rgba(255,255,255,.12)}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--muted);font-size:12px}
.chip.ok{background:var(--okbg);color:var(--ok-t)}.chip.warn{background:var(--warnbg);color:var(--warn-t)}.chip.bad{background:var(--badbg);color:var(--bad-t)}
nav{display:flex;gap:4px;padding:12px 24px 0;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--panel)}
nav button{border:0;background:transparent;padding:10px 16px;color:var(--muted);font:600 14px var(--font-sans);cursor:pointer;border-bottom:2px solid transparent;transition:color 220ms var(--ease)}
nav button:hover{color:var(--link-hover)}
nav button.on{color:var(--fg);border-bottom-color:var(--fg)}
nav button[hidden]{display:none}
main{padding:24px 24px 48px;max-width:1280px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:16px}
label{display:flex;flex-direction:column;gap:4px;font:400 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
select,input,button.btn{font:400 14px var(--font-sans);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)}
select:focus,input:focus,textarea:focus{outline:2px solid #2F80ED;outline-offset:1px}
button.btn{cursor:pointer;background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600;transition:background 220ms var(--ease),transform 100ms var(--ease)}
button.btn:hover{background:var(--accent-hover)}button.btn:active{transform:scale(.95)}
button.btn.ghost{background:transparent;color:var(--fg);border-color:var(--fg)}
/* Botões Entrar/Sair: contraste permanente no cabeçalho escuro.
   Regra após button.btn.ghost para evitar que a cor global torne o texto invisível. */
header button.btn.ghost{background:#FFFFFF;color:#002232;border:1px solid #FFFFFF;font-weight:700;min-width:74px;box-shadow:0 1px 4px rgba(0,0,0,.16)}
header button.btn.ghost:hover{background:#EAF2F5;color:#002232;border-color:#EAF2F5}
header button.btn.ghost:focus-visible{outline:3px solid #F2C94C;outline-offset:3px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:28px 0 28px 0;padding:18px 20px;box-shadow:var(--shadow-sm);transition:transform 220ms var(--ease),box-shadow 220ms var(--ease)}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.card .k{font:400 11px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card .v{font:700 32px/1.1 var(--font-display);letter-spacing:-.02em;color:var(--fg);margin-top:6px}
.card .s{font-size:12px;color:var(--muted);margin-top:2px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.box h2{font:600 15px var(--font-sans);margin:0 0 12px;color:var(--fg)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{font:400 11px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
td:first-child,th:first-child{text-align:left}
td.mid{color:var(--warn-t);background:var(--warnbg)}td.na{color:var(--muted);font-style:italic}td.ok{color:var(--ok-t);background:var(--okbg)}td.bad{color:var(--bad-t);background:var(--badbg)}
.ies{font-weight:700}
.empty{color:var(--muted);padding:28px;text-align:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.canvas{position:relative;height:340px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.msg{padding:10px 14px;border-radius:12px;margin:8px 0;font-size:13px}
.msg.ok{background:var(--okbg);color:var(--ok-t)}.msg.bad{background:var(--badbg);color:var(--bad-t)}.msg.warn{background:var(--warnbg);color:var(--warn-t)}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--fg);padding:22px;min-width:320px}
dialog::backdrop{background:rgba(0,34,50,.55)}
dialog form{display:flex;flex-direction:column;gap:12px}
.lote input{width:78px;padding:6px;text-align:center}
.lote td:first-child{min-width:190px}
.lote tr.chg td{background:var(--warnbg)}
textarea{width:100%;min-height:90px;font:12px/1.4 var(--font-mono);padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)}
</style>
</head>
<body>
<header>
  <div><div class="eyebrow">Starian · Suporte UNLT</div><h1>Índice de Eficiência do Suporte</h1><div class="note">IES por analista, mês a mês</div></div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <span id="conn" class="chip">Conectando…</span>
    <span id="who" class="chip" hidden></span>
    <button id="loginBtn" class="btn ghost" hidden>Entrar</button>
    <button id="logoutBtn" class="btn ghost" hidden>Sair</button>
  </div>
</header>
<nav id="tabs">
  <button data-tab="time" class="on">Visão do time</button>
  <button data-tab="analista">Analista</button>
  <button data-tab="techleaders">Tech Leaders</button>
  <button data-tab="lancar">Lançar dados</button>
  <button data-tab="regras">Regras do IES</button>
</nav>
<main>
  <section id="tab-time"></section>
  <section id="tab-analista" hidden></section>
  <section id="tab-techleaders" hidden></section>
  <section id="tab-lancar" hidden></section>

</main>

<dialog id="dlg">

    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button type="button" class="btn ghost" id="cancelLogin">Cancelar</button>
      <button type="submit" class="btn">Entrar</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/parse@4.3.1/dist/parse.min.js"></script>
<script type="module">
/* =====================================================================
   1) CONFIGURAÇÃO — Back4App (Parse)
      Back4App > seu app > App Settings > Security & Keys:
      copie "Application ID" e "JavaScript Key" e cole abaixo.
      Enquanto estiverem como "COLE_AQUI", o painel mostra a equipe sem números.
      Para ver o layout com dados fictícios, abra o arquivo com  ?demo=1  no final do endereço.
   ===================================================================== */
const B4A = {
  appId: "Y3S01W2GCPjZS8T07MLS1T9lZpadDj0hprfhZpke",
  jsKey: "r0im48dona8wQMzS52URyl4MVIrmQtg8Fctl8jOJ",
  serverURL: "https://parseapi.back4app.com"
};
const OPTIONS = { anoAtual: 2026 };

/* =====================================================================
   2) REGRAS DO IES (mesmas fórmulas do modelo em Excel)
   ===================================================================== */
// <core>
const KEYS = ['flr','csat','reab','tme','sla','back'];
const LABEL = {flr:'FLR (%)',csat:'CSAT (%)',reab:'Reabertos (%)',tme:'Tempo Resolução P85 (dias)',sla:'SLA Solução (%)',back:'SLA Backlog (%)'};
const FULL = {flr:'FLR - First Level Resolution (%)',csat:'CSAT - Customer Satisfaction Score (%)',reab:'Tickets reabertos (%)',tme:'Tempo de Resolução de Tickets — P85 (dias)',sla:'% SLA de Solução (%)',back:'SLA de Solução por Backlog (%)'};
// Campos de contagem extraídos do mesmo Painel de Suporte do Projuris.
// 'back' = % SLA de solução por backlog (existente); 'backlogTickets' = quantidade no backlog (novo).
const EXTRA_KEYS = ['ticketsFechados','backlogTickets','slaPrimeira'];
const ALL_KEYS = [...KEYS,...EXTRA_KEYS];
LABEL.ticketsFechados = 'Tickets Fechados';
LABEL.backlogTickets = 'Backlog de Tickets';
FULL.ticketsFechados = 'Tickets Fechados (quantidade)';
FULL.backlogTickets = 'Backlog de Tickets (quantidade)';
LABEL.slaPrimeira = 'SLA 1ª Resposta (%)';
FULL.slaPrimeira = '% SLA de 1ª Resposta — contrato N3 (meta 99%)';
const N2_KEYS = ['ticketsFechados','csat','reab','backlogTickets','tme'];
const N2_CTX = ['sla','back']; // oficiais, apenas contexto, sem nota individual. P85 volta a pontuar no N2.
const N2_ENTRY = [...N2_KEYS,...N2_CTX];
// N3: somente indicadores oficiais; pesos são PROPOSTA gerencial, não constam do PDF oficial.
// N3: nove indicadores oficiais, incluindo SLA Backlog e P85 com pesos. FLR pode avaliar o primeiro atendimento DIRETO do N3
// a clientes prioritários, se o BI extrair a métrica sem misturar apoio ao N2.
// SLA 1ª resposta é contratual, meta 99%, e deve ser informado na avaliação N3.
const N3_KEYS = ['slaPrimeira','sla','flr','back','csat','reab','ticketsFechados','backlogTickets','tme'];
const N3_CTX = [];
const N3_ENTRY = [...N3_KEYS];
const N3_PASTE = [...N3_KEYS];
const isN2 = nivel => nivel === 'N2';
const isN3 = nivel => nivel === 'N3';
// 'N1/N2 Peticiona' mantém, por enquanto, as regras atuais do N1.
const camposLancamento = nivel => isN2(nivel) ? N2_ENTRY : isN3(nivel) ? N3_ENTRY : KEYS;
const temNumero = v => v !== null && v !== undefined && v !== '' && Number.isFinite(Number(v));
const fmtCampo = (k,v) => fmt(v,['ticketsFechados','backlogTickets'].includes(k)?0:1);
const HIGHER = {flr:true,csat:true,reab:false,tme:false,sla:true,back:true};
const DEFAULT_CFG = {
  pesos:{flr:.20,csat:.20,reab:.15,tme:.15,sla:.20,back:.10},
  // PESOS GERENCIAIS PROPOSTOS (o painel oficial NÃO estabelece pesos N2/N3).
  // Não introduzimos indicadores novos: os campos são os do Painel de Suporte Projuris.
  n2Pesos:{ticketsFechados:.20,csat:.30,reab:.20,backlogTickets:.15,tme:.15},
  n3Pesos:{slaPrimeira:.25,sla:.15,flr:.10,back:.10,csat:.10,reab:.05,ticketsFechados:.05,backlogTickets:.05,tme:.15},
  // Benchmarks de volume PROVISÓRIOS, não oficiais: ajuste quando houver histórico por analista.
  // Tickets fechados: zero = 0 pontos, 20 ou mais/mês = 100 pontos.
  // Backlog bruto: até 5 = 100 pontos, 25 ou mais = 0 pontos.
  volumeNota:{ticketsFechados100:20,backlog100:5,backlog0:25},
  n2Bench:{
    tme:{dir:'down',saud:12,top:8,topNome:'Excelente',texto:'Tempo de Resolução P85: excelente ≤8 dias; saudável >8–12 dias; abaixo do saudável >12 dias. Pontuação: ≤8 = 100; ≥18 = 0.'},
    ticketsFechados:{dir:'up',saud:12,top:20,topNome:'Referência proposta',texto:'PROPOSTA (mensal): atenção <12; saudável 12–19; destaque ≥20 tickets fechados.'},
    backlogTickets:{dir:'down',saud:12,top:5,topNome:'Referência proposta',texto:'PROPOSTA (posição mensal): destaque ≤5; saudável 6–12; atenção >12 tickets em aberto.'}
  },
  // Referências do PDF: SLA Solução >95%, CSAT >93%, FLR geral >95%. P85 é o Tempo de Resolução (não o TME do chat).
  // Meta contratual do SLA de primeira resposta N3 = 99%, INFORMADA PELA GESTORA.
  // Os limites de cor abaixo são proposta de visualização, NÃO metas oficiais adicionais.
  n3Bench:{
    tme:{dir:'down',saud:12,top:8,topNome:'Excelente',texto:'Tempo de Resolução P85: excelente ≤8 dias; saudável >8–12 dias; abaixo do saudável >12 dias. Pontuação: ≤8 = 100; ≥18 = 0.'},
    sla:{dir:'up',saud:90,top:95,topNome:'Referência de SLA',texto:'Meta geral do painel: acima de 95%. Faixa visual sugerida: 90–<95% atenção; ≥95% destaque.'},
    csat:{dir:'up',saud:85,top:93,topNome:'Referência de CSAT',texto:'Meta oficial do painel: acima de 93%. Faixa visual sugerida: 85–<93% atenção; ≥93% destaque.'},
    ticketsFechados:{dir:'up',saud:12,top:20,topNome:'Referência proposta',texto:'PROPOSTA (mensal): atenção <12; saudável 12–19; destaque ≥20 tickets fechados.'},
    backlogTickets:{dir:'down',saud:12,top:5,topNome:'Referência proposta',texto:'PROPOSTA: destaque ≤5; saudável 6–12; atenção >12 tickets em aberto.'},
    slaPrimeira:{dir:'up',saud:99,top:99,topNome:'Meta contratual atendida',texto:'META CONTRATUAL N3: ≥99% (informada pela gestora). Abaixo de 99% = fora da meta. Pontuação gerencial progressiva entre 95% e 99%.'},
    flr:{dir:'up',saud:90,top:95,topNome:'Referência FLR',texto:'Painel oficial: meta geral de FLR acima de 95%. Aplicar ao N3 apenas aos chamados recebidos diretamente e concluídos sem escalonamento, se o BI disponibilizar o recorte.'}
  },
  lim:{reab:[.03,.12],tme:[8,18],back:[.9,.5]},      // [vale 100 pts, vale 0 pts]
  // Benchmark da aba "Detalhamento" do modelo. dir 'up' = quanto maior melhor; 'down' = quanto menor melhor.
  // top = a partir de quando é a faixa de cima; saud = limite da faixa "Saudável". Abaixo disso = abaixo do saudável.
  bench:{
    flr: {dir:'up',  saud:65, top:80, topNome:'Alta performance', texto:'Saudável 65–80% · Alta performance 80–90%'},
    csat:{dir:'up',  saud:85, top:90, topNome:'Excelente',        texto:'Saudável 85–90% · Excelente 90–95%'},
    reab:{dir:'down',saud:6,  top:4,  topNome:'Excelente',        texto:'Excelente 2–4% · Saudável 4–6%'},
    tme: {dir:'down',saud:12, top:8,  topNome:'Excelente',        texto:'Excelente 5–8 dias · Saudável 8–12 dias'},
    sla: {dir:'up',  saud:85, top:90, topNome:'Excelente',        texto:'Saudável 85–90% · Excelente 90–95%'},
    back:{dir:'up',  saud:60, top:75, topNome:'Excelente',        texto:'Saudável 60–75% · Excelente 75–90%'}
  },
  metaIES:78,                                         // IES mínimo esperado (aba IES_Metas_Bônus, coluna UNLT)
  naoSeAplica:{'N2':['flr','tme'],'N3':[]}, // N3 agora avalia FLR no atendimento direto prioritário; N1 mantém regra legada
  niveisFora:['Tech Lead','Tech Leader','Tech Leaders']                            // níveis que não entram no IES (não atendem a fila)
};
function benchPara(k,cfg,nivel){return (isN3(nivel)&&cfg.n3Bench[k])||(isN2(nivel)&&cfg.n2Bench[k])||cfg.bench[k];}
function faixa(k, v, cfg, nivel){   // 'topo' | 'saudavel' | 'abaixo' | null
  if (v===null||v===undefined||v===''||isNaN(v)) return null;
  const b=benchPara(k,cfg,nivel); if(!b) return null;
  v=+v; const up=b.dir==='up';
  if (up ? v>=b.top : v<=b.top) return 'topo';
  return (up ? v>=b.saud : v<=b.saud) ? 'saudavel' : 'abaixo';
}
function faixaNome(k, v, cfg, nivel){ const f=faixa(k,v,cfg,nivel); const b=benchPara(k,cfg,nivel); return f===null?'':f==='topo'?b.topNome:f==='saudavel'?'Saudável':'Abaixo do saudável'; }
function aplicaveis(nivel, cfg){ const fora=(cfg.naoSeAplica&&cfg.naoSeAplica[nivel])||[]; return KEYS.filter(k=>!fora.includes(k)); }
function nota(k, v, cfg){
  if (v===null || v===undefined || v==='' || isNaN(v)) return null;
  v = +v;
  if (k==='slaPrimeira') {
    // PROPOSTA GERENCIAL: régua exigente para meta contratual N3 = 99%.
    // Até 95% = 0 ponto; 96/97/98% = 25/50/75 pontos; >=99% = 100 pontos.
    return Math.max(0,Math.min(100,(v-95)*25));
  }
  if (k==='flr'||k==='csat'||k==='sla') return Math.max(0,Math.min(100,v));
  if (k==='ticketsFechados') return Math.max(0,Math.min(100,v/cfg.volumeNota.ticketsFechados100*100));
  if (k==='backlogTickets') {const {backlog100:a,backlog0:b}=cfg.volumeNota; return Math.max(0,Math.min(100,100-(v-a)/(b-a)*100));}
  if (k==='reab'){ const d=v/100,[a,b]=cfg.lim.reab; return d<=a?100:d>=b?0:((b-d)/(b-a))*100; }
  if (k==='tme'){ const [a,b]=cfg.lim.tme; return v<=a?100:v>=b?0:100-((v-a)/(b-a))*100; }
  if (k==='back'){ const d=v/100,[a,b]=cfg.lim.back; return d>=a?100:d<=b?0:((d-b)/(a-b))*100; }
}
function incluidos(row, cfg, nivel){   // os do nível + os opcionais que foram preenchidos
  const ap=aplicaveis(nivel,cfg);
  return KEYS.filter(k=>ap.includes(k) || (row && row[k]!==undefined && row[k]!==null && row[k]!=='' && !isNaN(row[k])));
}
function calcIES(row,cfg,nivel){
  // N2 e N3: todos os indicadores definidos têm PESO, que é usado no cálculo.
  // Campos em branco não viram zero: nota calculada com os campos disponíveis,
  // redistribuindo proporcionalmente o peso e indicando claramente PARCIAL.
  // Comparações individuais requerem cobertura 100%.
  if(isN2(nivel)||isN3(nivel)){
    const chaves=isN2(nivel)?N2_KEYS:N3_KEYS;
    const pesos=isN2(nivel)?cfg.n2Pesos:cfg.n3Pesos;
    // N3: FLR e SLA 1ª Resposta fazem parte da nota quando mensurados para atendimento direto.
    // Campo faltante produz IES PARCIAL; nunca confundir falta de dado com 0.
    const exigidos=chaves;
    const totalPesoElegivel=exigidos.reduce((a,k)=>a+pesos[k],0);
    let n=0,ponderada=0,pesoCoberto=0;
    for(const k of chaves){
      const nt=nota(k,row&&row[k],cfg);
      if(nt===null||nt===undefined||!Number.isFinite(nt))continue;
      n++; ponderada+=nt*pesos[k]; pesoCoberto+=pesos[k];
    }
    const ies=pesoCoberto?ponderada/pesoCoberto:null;
    return {ies,n,de:exigidos.length,parcial:n<exigidos.length,cobertura:totalPesoElegivel?pesoCoberto/totalPesoElegivel*100:0};
  }
  const ks=incluidos(row,cfg,nivel),soma=ks.reduce((t,k)=>t+cfg.pesos[k],0);
  let n=0,s=0;
  for(const k of ks){const nt=nota(k,row&&row[k],cfg);if(nt!==null){n++;s+=nt*cfg.pesos[k]/soma;}}
  return n?{ies:s,n,de:ks.length,parcial:n<ks.length,cobertura:n/ks.length*100}:{ies:null,n:0,de:ks.length,parcial:true,cobertura:0};
}
// Para o acumulado anual, volume de tickets fechados é MOSTRADO como soma,
// mas PONTUADO pela média mensal (evita premiar artificialmente mais meses lançados).
function valoresParaNotaAnual(agregado){
  if(!agregado||!agregado.valores)return null;
  const valores={...agregado.valores};
  if(temNumero(valores.ticketsFechados)&&agregado.qtd.ticketsFechados)
    valores.ticketsFechados=valores.ticketsFechados/agregado.qtd.ticketsFechados;
  return valores;
}

// Consolidado anual calculado apenas no navegador a partir dos meses.
// Contagem de tickets fechados = SOMA mensal; backlog = ÚLTIMO valor mensal lançado.
// Indicadores de % e P85 = média aritmética mensal, não agregação ponderada oficial.
function consolidarAno(dadosAnalista, ano){
  const somas={}, qtd={}; let meses=0, backlogUltimo;
  for(let m=1; m<=12; m++){
    const linha = dadosAnalista[`${ano}-${String(m).padStart(2,'0')}`];
    if(!linha) continue;
    let temValor=false;
    for(const k of ALL_KEYS){
      const v=linha[k]; if(!temNumero(v)) continue;
      temValor=true;
      if(k==='backlogTickets'){ backlogUltimo=Number(v); continue; }
      somas[k]=(somas[k]||0)+Number(v);
      qtd[k]=(qtd[k]||0)+1;
    }
    if(temValor) meses++;
  }
  const valores={};
  for(const k of ALL_KEYS){
    if(k==='backlogTickets') { if(backlogUltimo!==undefined) valores[k]=backlogUltimo; }
    else if(qtd[k]) valores[k]=k==='ticketsFechados' ? somas[k] : somas[k]/qtd[k];
  }
  return {valores:meses?valores:null,meses,qtd};
}

// Consolidado de IES dos três níveis — NÃO soma as notas nem mistura indicadores.
// Cada analista tem seu IES calculado segundo os pesos de seu próprio nível.
// A média de cada nível considera apenas notas COMPLETAS; o IES geral atribui
// 1/3 a N1, 1/3 a N2 e 1/3 a N3 (sem favorecer o grupo com mais analistas).
// "N1/N2 Peticiona" usa o modelo N1 definido no dashboard.
function grupoIES(nivel){return ['Tech Lead','Tech Leader','Tech Leaders'].includes(nivel)?null:isN2(nivel)?'N2':isN3(nivel)?'N3':'N1';}
// Retorna as carteiras ativas; usa o nome do analista como referência,
// pois o ID salvo no Back4App pode ser diferente do slug usado no pacote.
function lideresDoAnalista(a){
  if(!grupoIES(a.nivel)) return [];
  if(a.nivel==='N1') return ['alessandro','douglas'];
  const nome=slug(a.demoNomeOriginal||a.nome);
  if(EXCLUSIVOS_ALESSANDRO.has(nome)) return ['alessandro'];
  return ['douglas'];
}
function analistasDoLider(id){return state.analistas.filter(a=>lideresDoAnalista(a).includes(id));}
function resumirIESCarteira(periodo,id){

}
function resumirIESGeral(periodo,analistas=state.analistas,exigirTresNiveis=true){
  const anual=periodo.endsWith('-ANO'),ano=periodo.slice(0,4);
  const nomes=['N1','N2','N3'];
  const grupos=Object.fromEntries(nomes.map(n=>[n,{nivel:n,completos:[],parciais:0,semDados:0,total:0,media:null}]));
  for(const a of analistas){
    const nivel=grupoIES(a.nivel);
    if(!nivel) continue; // Tech Leaders nunca entram no cálculo dos analistas.
    const g=grupos[nivel];
    g.total++;
    const dados=state.dados[a.id]||{};
    const consolidado=anual?consolidarAno(dados,ano):null;
    const r=anual?valoresParaNotaAnual(consolidado):dados[periodo];
    const resultado=calcIES(r,state.cfg,a.nivel);
    if(resultado.ies===null||!Number.isFinite(resultado.ies))g.semDados++;
    else if(resultado.parcial)g.parciais++;
    else g.completos.push(resultado.ies);
  }
  for(const n of nomes){
    const g=grupos[n];
    if(g.completos.length)g.media=g.completos.reduce((s,v)=>s+v,0)/g.completos.length;
  }
  // UNLT exige N1, N2 e N3. Cada líder exige apenas os níveis que possui.
  // Ex.: Alessandro tem N1 + N2 e Douglas tem N1 + N2 + N3.
  const niveisConsiderados=exigirTresNiveis?nomes:nomes.filter(n=>grupos[n].total>0);
  const presentes=niveisConsiderados.filter(n=>grupos[n].media!==null);
  const geral=niveisConsiderados.length&&presentes.length===niveisConsiderados.length
    ? presentes.reduce((s,n)=>s+grupos[n].media,0)/niveisConsiderados.length : null;
  const mediaDisponivel=presentes.length?presentes.reduce((s,n)=>s+grupos[n].media,0)/presentes.length:null;
  return {grupos,geral,mediaDisponivel,niveisComDados:presentes.length,niveisConsiderados,
    completos:nomes.reduce((s,n)=>s+grupos[n].completos.length,0),
    parciais:nomes.reduce((s,n)=>s+grupos[n].parciais,0),
    semDados:nomes.reduce((s,n)=>s+grupos[n].semDados,0)};
}

function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seedDemo(){
  const rnd = mulberry(42);
  state.analistas = TEAM.map(([nome,nivel],i)=>({id:'demo-'+(i+1),nome:'Analista Demo '+String(i+1).padStart(2,'0'),demoNomeOriginal:nome,nivel}));
  for (const a of state.analistas){
    const base = {flr:82+rnd()*14,csat:84+rnd()*11,reab:2.5+rnd()*3.5,tme:6+rnd()*8,sla:86+rnd()*10,back:45+rnd()*35};
    state.dados[a.id] = {};
    for (const p of ['2026-07','2026-08','2026-09','2026-10']){
      const r = {}; for (const k of aplicaveis(a.nivel,DEFAULT_CFG)){ const j=(rnd()-.5)*(k==='tme'?3:k==='reab'?1.2:8); r[k]=Math.max(0,+(base[k]+j).toFixed(1)); if(k!=='tme'&&k!=='reab') r[k]=Math.min(100,r[k]); }
      if(isN2(a.nivel)||isN3(a.nivel)){
        r.ticketsFechados=Math.round(12+rnd()*25);
        r.backlogTickets=Math.round(4+rnd()*18);
      }
      if(isN3(a.nivel)) {r.slaPrimeira=+(95+rnd()*5).toFixed(1); r.flr=+(85+rnd()*14).toFixed(1);}
      state.dados[a.id][p]=r;
    }
  }
}

async function fetchAll(cls){
  const out=[]; let skip=0;
  for(;;){ const q=new Parse.Query(cls); q.limit(1000); q.skip(skip); q.ascending('createdAt'); const r=await q.find(); out.push(...r); if(r.length<1000) break; skip+=1000; }
  return out;
}
async function carregar(){
  const [an, me] = await Promise.all([fetchAll('Analista'), fetchAll('Medicao')]);
  state.anaObjs = {}; 
  state.analistas = an.map(o=>{ const id=o.get('slug')||slug(o.get('nome')); state.anaObjs[id]=o; return {id,nome:o.get('nome'),nivel:o.get('nivel'),ativo:o.get('ativo')}; })
    .filter(a=>a.ativo!==false && !DEFAULT_CFG.niveisFora.includes(a.nivel)).sort((a,b)=>a.nome.localeCompare(b.nome));
  state.dados = {}; state.objs = {};
  for (const o of me){
    const aid=o.get('analistaId'), p=o.get('periodo'); if(!aid||!p) continue;
    const r={}; for(const k of ALL_KEYS){ const v=o.get(k); if(v!==undefined&&v!==null) r[k]=v; }
    (state.dados[aid]=state.dados[aid]||{})[p]=r; state.objs[aid+'|'+p]=o;
  }
}

async function salvarLote(periodo, linhas){
  if(!podeEditar()) throw new Error('Acesso somente leitura. Solicite permissão de gestor para salvar dados.');
  if (periodo.endsWith('-ANO')) throw new Error('O acumulado anual é automático: lance apenas os meses.');
  if(DEMO){
    for(const l of linhas){
      const d=(state.dados[l.aid]=state.dados[l.aid]||{});
      const r=d[periodo]||{};
      for(const [k,v] of Object.entries(l.alterados)) if(v===undefined) delete r[k]; else r[k]=v;
      d[periodo]=r;
    }
    render(); return linhas.length;
  }
  const objs=[];
  for(const l of linhas){
    const key=l.aid+'|'+periodo; let o=state.objs[key];
    if(!o){o=new Parse.Object('Medicao'); o.set('analistaId',l.aid); o.set('periodo',periodo);}
    // Só altera os campos editados. Preserva valores antigos de outras métricas.
    for(const [k,v] of Object.entries(l.alterados)) {
      if(v===undefined) o.unset(k); else o.set(k,v);
    }
    o.set('atualizadoPor',state.user.get('username'));
    objs.push(o);
  }
  await Parse.Object.saveAll(objs);
  await recarregar(); render(); return objs.length;
}

}

    h('p',{},'Os N1 fazem parte das duas carteiras, mas entram apenas uma vez no IES geral UNLT, que continua calculado independentemente com todos os analistas. Os Tech Leaders não têm indicadores lançados em nome próprio.'),
    h('p',{},'Se qualquer nível existente na carteira não tiver nota completa, o IES vinculado não será exibido. Com analistas pendentes, o resultado é uma prévia. A referência IES ≥ 78 é do modelo anterior; não foi cadastrada uma nova meta contratual para os líderes.'),
    h('p',{},'Na aba Tech Leaders, selecione Alessandro ou Douglas Cubas para ver exclusivamente a carteira escolhida, os lançamentos faltantes, as médias por nível e a evolução dos dois líderes.')));
  root.append(h('div',{class:'box'},h('h2',{},'Acumulado anual — todos os níveis'),
    h('p',{},'Os dados mensais são consolidados no navegador. Tickets fechados são mostrados como soma anual, mas sua nota considera a média mensal nos meses em que o indicador foi lançado. Backlog bruto corresponde ao último valor mensal informado.'),
    h('p',{},'Percentuais, SLA e Tempo de Resolução P85: médias simples dos meses com valor. O P85 anual correto exigiria calcular novamente o percentil sobre todos os tickets do ano; a média dos P85 mensais é apenas uma aproximação gerencial. Uma média de percentuais também não corresponde à taxa oficial consolidada por ticket.')));
}

function render(){
  // Tech Leaders podem consultar todas as visões; a aba de edição só aparece para gestores.
  const tabLancamento=document.querySelector('#tabs button[data-tab="lancar"]');
  if(tabLancamento) tabLancamento.hidden=!podeEditar();
  if(ui.tab==='lancar'&&!podeEditar()) ui.tab='techleaders';
  $('#tab-time').hidden = ui.tab!=='time'; $('#tab-analista').hidden = ui.tab!=='analista';
  $('#tab-techleaders').hidden = ui.tab!=='techleaders';
  $('#tab-lancar').hidden = ui.tab!=='lancar'; $('#tab-regras').hidden = ui.tab!=='regras';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===ui.tab));
  if(ui.tab==='time') renderTime(); else if(ui.tab==='analista') renderAnalista(); else if(ui.tab==='techleaders') renderTechLeaders(); else if(ui.tab==='lancar') renderLancar(); else renderRegras();
}
function afterAuth(){
  const who=$('#who'), li=$('#loginBtn'), lo=$('#logoutBtn');
  who.hidden=!state.user;
  who.textContent=state.user?((state.user.get?state.user.get('username'):state.user.username)+(podeEditar()?' · Gestão':' · Somente leitura')):'';
  li.hidden = DEMO || !CONFIGURED || !!state.user; lo.hidden = DEMO || !CONFIGURED || !state.user;
  render();
}
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{ui.tab=b.dataset.tab;render();}));
$('#loginBtn').addEventListener('click',()=>$('#dlg').showModal());
$('#cancelLogin').addEventListener('click',()=>$('#dlg').close());
$('#logoutBtn').addEventListener('click',()=>logout());
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault(); const err=$('#loginErr'); err.hidden=true;
  try{ await login($('#em').value,$('#pw').value); $('#pw').value=''; $('#dlg').close(); }
  catch(x){ err.textContent='Não foi possível entrar: '+(x.message||x); err.hidden=false; }
});
window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>render());
render(); connect();
</script>
