<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/parse@4.3.1/dist/parse.min.js"></script>
<script type="module">
/* =====================================================================
   1) CONFIGURAÇÃO — Back4App (Parse)
      Back4App > seu app > App Settings > Security & Keys:
      copie "Application ID" e "JavaScript Key" e cole abaixo.
      Enquanto estiverem como "COLE_AQUI", o painel mostra a equipe sem números.
      Para ver o layout com dados fictícios, abra o arquivo com  ?demo=1  no final do endereço.
   ===================================================================== */
const B4A = {
  appId: "Y3S01W2GCPjZS8T07MLS1T9lZpadDj0hprfhZpke",
  jsKey: "r0im48dona8wQMzS52URyl4MVIrmQtg8Fctl8jOJ",
  serverURL: "https://parseapi.back4app.com"
};
const OPTIONS = { anoAtual: 2026 };

/* =====================================================================
   2) REGRAS DO IES (mesmas fórmulas do modelo em Excel)
   ===================================================================== */
// <core>
const KEYS = ['flr','csat','reab','tme','sla','back'];
const LABEL = {flr:'FLR (%)',csat:'CSAT (%)',reab:'Reabertos (%)',tme:'TME P85 (dias)',sla:'SLA Solução (%)',back:'SLA Backlog (%)'};
const FULL = {flr:'FLR - First Level Resolution (%)',csat:'CSAT - Customer Satisfaction Score (%)',reab:'Tickets reabertos (%)',tme:'TME - Tempo de Resolução - P85 (dias)',sla:'% SLA de Solução (%)',back:'SLA de Solução por Backlog (%)'};
// Campos de contagem extraídos do mesmo Painel de Suporte do Projuris.
// 'back' = % SLA de solução por backlog (existente); 'backlogTickets' = quantidade no backlog (novo).
const EXTRA_KEYS = ['ticketsFechados','backlogTickets','slaPrimeira'];
const ALL_KEYS = [...KEYS,...EXTRA_KEYS];
LABEL.ticketsFechados = 'Tickets Fechados';
LABEL.backlogTickets = 'Backlog de Tickets';
FULL.ticketsFechados = 'Tickets Fechados (quantidade)';
FULL.backlogTickets = 'Backlog de Tickets (quantidade)';
LABEL.slaPrimeira = 'SLA 1ª Resposta (%)';
FULL.slaPrimeira = '% SLA de 1ª Resposta (quando aplicável)';
const N2_KEYS = ['ticketsFechados','csat','reab','backlogTickets'];
const N2_CTX = ['sla','back','tme']; // oficiais, apenas contexto, sem nota individual
const N2_ENTRY = [...N2_KEYS,...N2_CTX];
// N3: somente indicadores oficiais; pesos são PROPOSTA gerencial, não constam do PDF oficial.
const N3_KEYS = ['sla','back','csat','reab'];
const N3_CTX = ['ticketsFechados','backlogTickets','tme','slaPrimeira'];
const N3_ENTRY = [...N3_KEYS,...N3_CTX];
const N3_PASTE = [...N3_KEYS,...N3_CTX];
const isN2 = nivel => nivel === 'N2';
const isN3 = nivel => nivel === 'N3';
// 'N1/N2 Peticiona' mantém, por enquanto, as regras atuais do N1.
const camposLancamento = nivel => isN2(nivel) ? N2_ENTRY : isN3(nivel) ? N3_ENTRY : KEYS;
const temNumero = v => v !== null && v !== undefined && v !== '' && Number.isFinite(Number(v));
const fmtCampo = (k,v) => fmt(v,['ticketsFechados','backlogTickets'].includes(k)?0:1);
const HIGHER = {flr:true,csat:true,reab:false,tme:false,sla:true,back:true};
const DEFAULT_CFG = {
  pesos:{flr:.20,csat:.20,reab:.15,tme:.15,sla:.20,back:.10},
  // Distribuição SUGERIDA para o N3 (não é peso oficial do Painel de Suporte).
  n3Pesos:{sla:.35,back:.25,csat:.25,reab:.15},
  // Referências oficiais: meta SLA Suporte >95%, CSAT >93%.
  // Os limites de cor abaixo são proposta de visualização, NÃO metas oficiais adicionais.
  n3Bench:{
    sla:{dir:'up',saud:90,top:95,topNome:'Referência de SLA',texto:'Meta oficial do painel: acima de 95%. Faixa visual sugerida: 90–<95% atenção; ≥95% destaque.'},
    csat:{dir:'up',saud:85,top:93,topNome:'Referência de CSAT',texto:'Meta oficial do painel: acima de 93%. Faixa visual sugerida: 85–<93% atenção; ≥93% destaque.'},
  },
  lim:{reab:[.03,.12],tme:[8,18],back:[.9,.5]},      // [vale 100 pts, vale 0 pts]
  // Benchmark da aba "Detalhamento" do modelo. dir 'up' = quanto maior melhor; 'down' = quanto menor melhor.
  // top = a partir de quando é a faixa de cima; saud = limite da faixa "Saudável". Abaixo disso = abaixo do saudável.
  bench:{
    flr: {dir:'up',  saud:65, top:80, topNome:'Alta performance', texto:'Saudável 65–80% · Alta performance 80–90%'},
    csat:{dir:'up',  saud:85, top:90, topNome:'Excelente',        texto:'Saudável 85–90% · Excelente 90–95%'},
    reab:{dir:'down',saud:6,  top:4,  topNome:'Excelente',        texto:'Excelente 2–4% · Saudável 4–6%'},
    tme: {dir:'down',saud:12, top:8,  topNome:'Excelente',        texto:'Excelente 5–8 dias · Saudável 8–12 dias'},
    sla: {dir:'up',  saud:85, top:90, topNome:'Excelente',        texto:'Saudável 85–90% · Excelente 90–95%'},
    back:{dir:'up',  saud:60, top:75, topNome:'Excelente',        texto:'Saudável 60–75% · Excelente 75–90%'}
  },
  metaIES:78,                                         // IES mínimo esperado (aba IES_Metas_Bônus, coluna UNLT)
  naoSeAplica:{'N2':['flr','tme'],'N3':['flr']},      // regra legada N1 / N1-N2 Peticiona
  niveisFora:['Tech Lead']                            // níveis que não entram no IES (não atendem a fila)
};
function benchPara(k,cfg,nivel){return isN3(nivel) && cfg.n3Bench[k] ? cfg.n3Bench[k] : cfg.bench[k];}
function faixa(k, v, cfg, nivel){   // 'topo' | 'saudavel' | 'abaixo' | null
  if (v===null||v===undefined||v===''||isNaN(v)) return null;
  const b=benchPara(k,cfg,nivel); if(!b) return null;
  v=+v; const up=b.dir==='up';
  if (up ? v>=b.top : v<=b.top) return 'topo';
  return (up ? v>=b.saud : v<=b.saud) ? 'saudavel' : 'abaixo';
}
function faixaNome(k, v, cfg, nivel){ const f=faixa(k,v,cfg,nivel); const b=benchPara(k,cfg,nivel); return f===null?'':f==='topo'?b.topNome:f==='saudavel'?'Saudável':'Abaixo do saudável'; }
function aplicaveis(nivel, cfg){ const fora=(cfg.naoSeAplica&&cfg.naoSeAplica[nivel])||[]; return KEYS.filter(k=>!fora.includes(k)); }
function nota(k, v, cfg){
  if (v===null || v===undefined || v==='' || isNaN(v)) return null;
  v = +v;
  if (k==='flr'||k==='csat'||k==='sla'||k==='slaPrimeira') return v;
  if (k==='reab'){ const d=v/100,[a,b]=cfg.lim.reab; return d<=a?100:d>=b?0:((b-d)/(b-a))*100; }
  if (k==='tme'){ const [a,b]=cfg.lim.tme; return v<=a?100:v>=b?0:100-((v-a)/(b-a))*100; }
  if (k==='back'){ const d=v/100,[a,b]=cfg.lim.back; return d>=a?100:d<=b?0:((d-b)/(a-b))*100; }
}
function incluidos(row, cfg, nivel){   // os do nível + os opcionais que foram preenchidos
  const ap=aplicaveis(nivel,cfg);
  return KEYS.filter(k=>ap.includes(k) || (row && row[k]!==undefined && row[k]!==null && row[k]!=='' && !isNaN(row[k])));
}
function calcIES(row, cfg, nivel){
  // N2: indicadores exibidos sem nota, pois não existem metas/escala oficiais para volume/backlog.
  if (isN2(nivel)) return {ies:null,n:0,de:0};
  // N3: nota proposta independente do IES N1, requer TODOS os 4 indicadores pontuáveis.
  if (isN3(nivel)){
    const n=N3_KEYS.filter(k=>temNumero(row && row[k])).length;
    if(n<N3_KEYS.length) return {ies:null,n,de:N3_KEYS.length};
    const ies=N3_KEYS.reduce((s,k)=>s+nota(k,row[k],cfg)*cfg.n3Pesos[k],0);
    return {ies,n,de:N3_KEYS.length};
  }
  const ks=incluidos(row,cfg,nivel), soma=ks.reduce((t,k)=>t+cfg.pesos[k],0);
  let n=0,s=0;
  for (const k of ks){ const nt=nota(k,row&&row[k],cfg); if(nt!==null){n++; s+=nt*cfg.pesos[k]/soma;} }
  return n ? {ies:s,n,de:ks.length} : {ies:null,n:0,de:ks.length};
}
// </core>

/* =====================================================================
   3) CAMADA DE DADOS (Back4App / Parse)
      Classe Analista: nome, nivel, slug, ativo
      Classe Medicao : analistaId (slug), periodo (ex.: "2026-07"), flr, csat, reab, tme, sla, back, ticketsFechados, backlogTickets, slaPrimeira (opcional N3)
      O acumulado do ano é calculado a partir dos meses; não é gravado no Back4App.
   ===================================================================== */
const TEAM = [
 ["Gustavo Gaeta","N1"],["Humberto Ferro","N1"],["Lucas Rodrigues","N1"],["Maria Vitória Muniz","N1"],
 ["Jordânia Vitória","N1"],["Leonardo de Souza Fernandes","N1"],["Felipe da Silva Luz","N1/N2 Peticiona"],
 ["Max Filipe Macedo Braga","N1/N2 Peticiona"],["Julia Stein","N2"],["Jussara Wiemes","N2"],
 ["Patrícia Ledoux","N2"],["Luiz Mário Fontes","N2"],["Cristian Andrade","N3"],["Cristian Dias","N3"],
 ["Rafael de Sousa Tavares","N3"]
];
const norm = s => (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const slug = s => norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const periodos = [];
for (const y of [OPTIONS.anoAtual, OPTIONS.anoAtual-1]){
  periodos.push({id:`${y}-ANO`,label:`${y} — acumulado do ano`});
  for (let m=1;m<=12;m++) periodos.push({id:`${y}-${String(m).padStart(2,'0')}`,label:`${MESES[m-1]}/${y}`});
}
const DEMO = new URLSearchParams(location.search).has('demo');
const CONFIGURED = !!B4A.appId && !B4A.appId.startsWith('COLE') && !!B4A.jsKey && !B4A.jsKey.startsWith('COLE');
const state = {cfg:DEFAULT_CFG, analistas:[], dados:{}, objs:{}, anaObjs:{}, user:null};

// Consolidado anual calculado apenas no navegador a partir dos meses.
// Contagem de tickets fechados = SOMA mensal; backlog = ÚLTIMO valor mensal lançado.
// Indicadores de % e P85 = média aritmética mensal, não agregação ponderada oficial.
function consolidarAno(dadosAnalista, ano){
  const somas={}, qtd={}; let meses=0, backlogUltimo;
  for(let m=1; m<=12; m++){
    const linha = dadosAnalista[`${ano}-${String(m).padStart(2,'0')}`];
    if(!linha) continue;
    let temValor=false;
    for(const k of ALL_KEYS){
      const v=linha[k]; if(!temNumero(v)) continue;
      temValor=true;
      if(k==='backlogTickets'){ backlogUltimo=Number(v); continue; }
      somas[k]=(somas[k]||0)+Number(v);
      qtd[k]=(qtd[k]||0)+1;
    }
    if(temValor) meses++;
  }
  const valores={};
  for(const k of ALL_KEYS){
    if(k==='backlogTickets') { if(backlogUltimo!==undefined) valores[k]=backlogUltimo; }
    else if(qtd[k]) valores[k]=k==='ticketsFechados' ? somas[k] : somas[k]/qtd[k];
  }
  return {valores:meses?valores:null,meses,qtd};
}

function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seedDemo(){
  const rnd = mulberry(42);
  state.analistas = TEAM.map(([,nivel],i)=>({id:'demo-'+(i+1),nome:'Analista Demo '+String(i+1).padStart(2,'0'),nivel}));
  for (const a of state.analistas){
    const base = {flr:82+rnd()*14,csat:84+rnd()*11,reab:2.5+rnd()*3.5,tme:6+rnd()*8,sla:86+rnd()*10,back:45+rnd()*35};
    state.dados[a.id] = {};
    for (const p of ['2026-07','2026-08','2026-09','2026-10']){
      const r = {}; for (const k of aplicaveis(a.nivel,DEFAULT_CFG)){ const j=(rnd()-.5)*(k==='tme'?3:k==='reab'?1.2:8); r[k]=Math.max(0,+(base[k]+j).toFixed(1)); if(k!=='tme'&&k!=='reab') r[k]=Math.min(100,r[k]); }
      if(isN2(a.nivel)||isN3(a.nivel)){
        r.ticketsFechados=Math.round(12+rnd()*25);
        r.backlogTickets=Math.round(4+rnd()*18);
      }
      if(isN3(a.nivel)) r.slaPrimeira=+(88+rnd()*11).toFixed(1);
      state.dados[a.id][p]=r;
    }
  }
}

async function fetchAll(cls){
  const out=[]; let skip=0;
  for(;;){ const q=new Parse.Query(cls); q.limit(1000); q.skip(skip); q.ascending('createdAt'); const r=await q.find(); out.push(...r); if(r.length<1000) break; skip+=1000; }
  return out;
}
async function carregar(){
  const [an, me] = await Promise.all([fetchAll('Analista'), fetchAll('Medicao')]);
  state.anaObjs = {}; 
  state.analistas = an.map(o=>{ const id=o.get('slug')||slug(o.get('nome')); state.anaObjs[id]=o; return {id,nome:o.get('nome'),nivel:o.get('nivel'),ativo:o.get('ativo')}; })
    .filter(a=>a.ativo!==false && !DEFAULT_CFG.niveisFora.includes(a.nivel)).sort((a,b)=>a.nome.localeCompare(b.nome));
  state.dados = {}; state.objs = {};
  for (const o of me){
    const aid=o.get('analistaId'), p=o.get('periodo'); if(!aid||!p) continue;
    const r={}; for(const k of ALL_KEYS){ const v=o.get(k); if(v!==undefined&&v!==null) r[k]=v; }
    (state.dados[aid]=state.dados[aid]||{})[p]=r; state.objs[aid+'|'+p]=o;
  }
}
function escolherPeriodoPadrao(){
  const ms = periodos.filter(p=>!p.id.endsWith('ANO')).map(p=>p.id).sort().reverse();
  const achou = ms.find(p=>state.analistas.some(a=>state.dados[a.id]&&state.dados[a.id][p]));
  if (achou){ ui.periodo=achou; ui.lPeriodo=achou; ui.ano=+achou.slice(0,4); }
}

  if (DEMO){ seedDemo(); setConn('MODO DEMONSTRAÇÃO — dados fictícios (?demo=1)','warn'); state.user={username:'demo'}; escolherPeriodoPadrao(); afterAuth(); return; }
  state.analistas = TEAM.map(([nome,nivel])=>({id:slug(nome),nome,nivel}));

async function salvarLote(periodo, linhas){
  if (periodo.endsWith('-ANO')) throw new Error('O acumulado anual é automático: lance apenas os meses.');
  if(DEMO){
    for(const l of linhas){
      const d=(state.dados[l.aid]=state.dados[l.aid]||{});
      const r=d[periodo]||{};
      for(const [k,v] of Object.entries(l.alterados)) if(v===undefined) delete r[k]; else r[k]=v;
      d[periodo]=r;
    }
    render(); return linhas.length;
  }
  const objs=[];
  for(const l of linhas){
    const key=l.aid+'|'+periodo; let o=state.objs[key];
    if(!o){o=new Parse.Object('Medicao'); o.set('analistaId',l.aid); o.set('periodo',periodo);}
    // Só altera os campos editados. Preserva valores antigos de outras métricas.
    for(const [k,v] of Object.entries(l.alterados)) {
      if(v===undefined) o.unset(k); else o.set(k,v);
    }
    o.set('atualizadoPor',state.user.get('username'));
    objs.push(o);
  }
  await Parse.Object.saveAll(objs);
  await recarregar(); render(); return objs.length;
}
async function cadastrarEquipe(){
  if (DEMO||!CONFIGURED) return;
  const existentes = new Set((await fetchAll('Analista')).map(o=>o.get('slug')||slug(o.get('nome'))));
  const novos = TEAM.filter(([n])=>!existentes.has(slug(n))).map(([nome,nivel])=>{ const o=new Parse.Object('Analista'); o.set('nome',nome); o.set('nivel',nivel); o.set('slug',slug(nome)); o.set('ativo',true); return o; });
  if (novos.length) await Parse.Object.saveAll(novos);
  await recarregar(); render();
}

      h('tr',{},h('td',{class:'ies'},'IES'),h('td',{}),h('td',{}),...serie.map(v=>h('td',{class:'ies '+iesClass(v)},fmt(v,1))),h('td',{class:'ies '+iesClass(acum.ies)},fmt(acum.ies,1)))));
  root.append(h('div',{class:'box'},h('h2',{},'Indicadores mês a mês'),h('div',{class:'tw'},t),h('div',{class:'note'},'Cores pelo benchmark do Detalhamento: verde = Excelente ou Alta performance; amarelo = Saudável; vermelho = abaixo do saudável. IES: meta ≥ '+state.cfg.metaIES+'. O campo Ano é calculado automaticamente, pela média dos meses lançados em cada indicador.')));
  chart('ch-an',{type:'line',data:{labels:MESES,datasets:[{label:'IES',data:serie.map(v=>v===null?null:+v.toFixed(2)),borderColor:css('--brand'),backgroundColor:css('--brand'),spanGaps:true,tension:.25},{label:'Meta IES',data:MESES.map(()=>state.cfg.metaIES),borderColor:css('--bad'),borderDash:[6,4],pointRadius:0}]},
    options:{maintainAspectRatio:false,scales:{y:{min:0,max:100}},plugins:{legend:{display:true}}}});
}

  root.append(h('div',{class:'box'},h('h2',{},'Evolução de tickets fechados'),h('div',{class:'canvas'},h('canvas',{id:'ch-n2-fechados'}))));
  root.append(h('div',{class:'box'},h('h2',{},'Evolução do backlog de tickets'),h('div',{class:'canvas'},h('canvas',{id:'ch-n2-backlog'}))));

      options:{maintainAspectRatio:false,scales:{y:{min:0,ticks:{precision:0}}},plugins:{legend:{display:false}}}});

function renderLancar(){
  const root=$('#tab-lancar'); root.replaceChildren();
  if(!state.user){root.append(h('div',{class:'box empty'},'Faça login para lançar dados.'));return;}
  if(!state.analistas.length||(!DEMO&&!Object.keys(state.anaObjs).length)){
    root.append(h('div',{class:'box'},h('h2',{},'Nenhum analista cadastrado no Back4App'),
      h('p',{},`Cadastre a equipe UNLT (${TEAM.length} pessoas) com um clique.`),
      h('button',{class:'btn',onclick:async e=>{e.target.disabled=true;try{await cadastrarEquipe();}catch(err){root.append(h('div',{class:'msg bad'},'Erro: '+(err.message||err)));}}},'Cadastrar equipe UNLT')));
    return;
  }
  const periodosLancamento=periodos.filter(p=>!p.id.endsWith('-ANO'));
  if(!ui.lPeriodo||ui.lPeriodo.endsWith('-ANO')) ui.lPeriodo=periodosLancamento[0].id;
  const inputs={}, orig=aid=>(state.dados[aid]||{})[ui.lPeriodo]||{};
  const analistaPorId=Object.fromEntries(state.analistas.map(a=>[a.id,a]));
  const marcar=(aid,tr)=>{
    const mudou=camposLancamento(analistaPorId[aid].nivel).some(k=>{
      const t=inputs[aid][k].value.trim().replace(',','.');
      const v=t===''?undefined:Number(t);
      return v!==orig(aid)[k];
    });
    tr.classList.toggle('chg',mudou);
  };
  const tbody=h('tbody',{},state.analistas.map(a=>{
    inputs[a.id]={}; const campos=camposLancamento(a.nivel);
    const tr=h('tr',{},h('td',{},`${a.nome} `,h('span',{class:'chip'},a.nivel||'—')),
      ...ALL_KEYS.map(k=>{
        if(!campos.includes(k)) return h('td',{class:'na'},'—');
        const i=h('input',{type:'text',inputmode:'decimal',value:orig(a.id)[k]!==undefined?String(orig(a.id)[k]).replace('.',','):'',oninput:()=>marcar(a.id,tr)});
        inputs[a.id][k]=i;
        return h('td',{},i);
      }));
    return tr;
  }));
  const msg=h('div',{id:'l-msg'});
  const ta=h('textarea',{placeholder:'N1: Analista; FLR; CSAT; Reabertos; TME P85; SLA Solução; SLA Backlog\nN2: Analista; Tickets Fechados; CSAT; Reabertos; Backlog de Tickets\nN3: Analista; SLA Solução; SLA Backlog; CSAT; Reabertos; Tickets Fechados; Backlog de Tickets; TME P85; SLA 1ª Resposta\nSepare por TAB ou ponto e vírgula.'});
  const aplicar=()=>{
    const porNome=Object.fromEntries(state.analistas.map(a=>[norm(a.nome),a]));
    let ok=0; const sem=[];
    for(const linha of ta.value.split(/\r?\n/)){
      if(!linha.trim()) continue;
      const c=linha.split(/\t|;/).map(x=>x.trim()); const a=porNome[norm(c[0])];
      if(!a){if(norm(c[0])!=='analista')sem.push(c[0]);continue;}
      const colunas=isN2(a.nivel)?N2_KEYS:isN3(a.nivel)?N3_PASTE:KEYS;
      colunas.forEach((k,i)=>{
        const v=(c[i+1]||'').replace('%','').trim();
        if(inputs[a.id][k]) inputs[a.id][k].value=v;
      });
      const k=colunas[0]; if(inputs[a.id][k]) inputs[a.id][k].dispatchEvent(new Event('input'));
      ok++;
    }
    msg.replaceChildren(h('div',{class:'msg '+(sem.length?'bad':'ok')},`${ok} linha(s) aplicada(s); confira e clique em Salvar.`+(sem.length?` Não reconhecidos: ${sem.join(', ')}`:'')));
  };
  root.append(h('div',{class:'box'},h('h2',{},'Lançamento mensal — N1, N2 e N3'),
    h('div',{class:'bar'},select('l-pe','Período',periodosLancamento.map(p=>({v:p.id,t:p.label})),ui.lPeriodo,v=>{ui.lPeriodo=v;render();})),
    h('div',{class:'note',style:'margin:0 0 8px'},'N2: Tickets Fechados, CSAT, Reabertos e Backlog de Tickets; SLA Solução, SLA Backlog e P85 são contexto. N3: SLA Solução, SLA Backlog, CSAT e Reabertos pontuam; Tickets Fechados, Backlog de Tickets, P85 e SLA de 1ª Resposta são contexto (opcionais). Valores em % sem símbolo, contagens inteiras. Célula vazia = não lançado.'),
    h('div',{class:'tw'},h('table',{class:'lote'},h('thead',{},h('tr',{},h('th',{},'Analista'),...ALL_KEYS.map(k=>h('th',{},LABEL[k])))),tbody)),
    msg,
    h('div',{style:'margin-top:10px;display:flex;gap:8px'},h('button',{class:'btn',onclick:async e=>{
      const linhas=[];
      for(const a of state.analistas){
        const alterados={};
        for(const k of camposLancamento(a.nivel)){
          const t=inputs[a.id][k].value.trim().replace(',','.');
          let v;
          if(t!==''){
            v=Number(t);
            if(!Number.isFinite(v)||((k==='ticketsFechados'||k==='backlogTickets')&&(!Number.isInteger(v)||v<0))||(['flr','csat','reab','sla','back','slaPrimeira'].includes(k)&&(v<0||v>100))||(k==='tme'&&v<0)){
              msg.replaceChildren(h('div',{class:'msg bad'},`Valor inválido em ${a.nome} (${LABEL[k]}): "${t}"`));return;
            }
          }
          if(v!==orig(a.id)[k]) alterados[k]=v;
        }
        if(Object.keys(alterados).length) linhas.push({aid:a.id,alterados});
      }
      if(!linhas.length){msg.replaceChildren(h('div',{class:'msg ok'},'Nada alterado para salvar.'));return;}
      e.target.disabled=true;
      try{const n=await salvarLote(ui.lPeriodo,linhas); const m=$('#l-msg'); if(m)m.replaceChildren(h('div',{class:'msg ok'},`${n} analista(s) salvo(s).`));}
      catch(err){msg.replaceChildren(h('div',{class:'msg bad'},'Não foi possível salvar: '+(err.message||err)));e.target.disabled=false;}
    }},'Salvar período'))),
    h('div',{class:'box'},h('h2',{},'Colar do Excel'),
      h('div',{class:'note'},'Ordem N1/N1-N2 Peticiona: Analista; FLR; CSAT; Reabertos; TME P85; SLA Solução; SLA Backlog. Ordem N2: Analista; Tickets Fechados; CSAT; Reabertos; Backlog de Tickets. Ordem N3: Analista; SLA Solução; SLA Backlog; CSAT; Reabertos; Tickets Fechados; Backlog de Tickets; TME P85; SLA 1ª Resposta. Valores de contexto podem ser preenchidos diretamente na tabela.'),
      ta,h('div',{style:'margin-top:8px'},h('button',{class:'btn ghost',onclick:aplicar},'Preencher a tabela com o que colei'))));
}

function renderRegras(){
  const root=$('#tab-regras'); root.replaceChildren();
  const c=state.cfg;
  const pesos = obj => Object.values(obj).reduce((s,v)=>s+v,0);
  const formula={
    flr:'Nota = FLR informado (0 a 100 pontos).',
    csat:'Nota = CSAT informado (0 a 100 pontos).',
    sla:'Nota = % SLA Solução informado (0 a 100 pontos).',
    slaPrimeira:'Indicador de contexto no N3; sem pontuação individual neste modelo.',
    reab:`Nota invertida e linear: ≤ ${(c.lim.reab[0]*100).toFixed(0)}% = 100 pts; ≥ ${(c.lim.reab[1]*100).toFixed(0)}% = 0 pt; no intervalo, interpolação linear.`,
    tme:`Nota invertida e linear (modelo N1): ≤ ${c.lim.tme[0]} dias = 100 pts; ≥ ${c.lim.tme[1]} dias = 0 pt.`,
    back:`Nota linear: ≥ ${Math.round(c.lim.back[0]*100)}% = 100 pts; ≤ ${Math.round(c.lim.back[1]*100)}% = 0 pt; no intervalo, interpolação linear.`,
    ticketsFechados:'Quantidade. Sem nota: o painel oficial não define produtividade mínima por analista.',
    backlogTickets:'Quantidade em aberto. Sem nota: o painel oficial não define meta individual de volume.'
  };
  function regra(k,peso,nivel,pontua){
    const bm=benchPara(k,c,nivel);
    const bench=bm?bm.texto:'Sem benchmark individual definido no painel oficial; usar como contexto.';
    return h('tr',{},
      h('td',{style:'text-align:left;white-space:normal;min-width:175px'},FULL[k]),
      h('td',{},pontua?`${Math.round(peso*100)}%`:'0% · contexto'),
      h('td',{style:'text-align:left;white-space:normal;min-width:265px'},bench),
      h('td',{style:'text-align:left;white-space:normal;min-width:280px'},pontua?formula[k]:`Não compõe o IES deste nível. ${formula[k]}`));
  }
  const table=(rows)=>h('div',{class:'tw'},h('table',{},h('thead',{},h('tr',{},...['Indicador','Peso','Benchmark','Nota (0–100) / regra'].map(x=>h('th',{},x)))),h('tbody',{},rows)));
  root.append(h('div',{class:'box'},h('h2',{},'Como ler as regras e as notas'),
    h('p',{},`IES = soma de (nota do indicador × peso). O referencial geral de IES ≥ ${c.metaIES} é mantido do modelo anterior; não é uma meta oficial específica para N2 ou N3 no PDF do Projuris.`),
    h('p',{},'Os indicadores são os do Painel de Suporte — V1 do Projuris. O painel oficial registra meta de SLA Suporte acima de 95% e CSAT acima de 93%. Não publica pesos próprios de IES por nível. Pesos do N3 e faixas de cor complementares são PROPOSTAS de gestão, não regras oficiais.'),
    h('p',{},'Não comparar diretamente ranking N1 × N3: cada nível tem pesos e atribuições diferentes. N2 não tem nota individual consolidada enquanto não houver parâmetros aprovados para produtividade e backlog.'),
    h('div',{class:'note'},'No N3, a nota só é exibida se os quatro indicadores pontuáveis estiverem informados. Indicador sem dado não é tratado como zero nem redistribui pesos.')));
  root.append(h('div',{class:'box'},h('h2',{},'N1 e N1/N2 Peticiona — regra anterior (mantida)'),
    h('p',{},'Os seis indicadores e pesos do HTML anterior permanecem como estavam. Indicadores não lançados deixam o resultado parcial, conforme a regra preexistente.'),
    table(KEYS.map(k=>regra(k,c.pesos[k],'N1',true))),
    h('div',{class:'note'},`Soma dos pesos: ${(pesos(c.pesos)*100).toFixed(0)}%. Benchmarks e limites desta seção são do modelo do IES anterior, não todos metas oficiais do PDF.`)));
  root.append(h('div',{class:'box'},h('h2',{},'N2 — somente indicadores oficiais, sem nota consolidada'),
    h('p',{},'Tickets Fechados, CSAT, Reabertos e Backlog de Tickets seguem visíveis. Não há peso individual aprovado nem benchmark oficial para converter quantidades de tickets em pontos; por isso o painel não inventa um IES N2.'),
    table([...N2_KEYS,...N2_CTX].map(k=>regra(k,0,'N2',false))),
    h('div',{class:'note'},'O benchmark exibido para CSAT, Reabertos, SLA e P85 é referência para leitura, não um peso de avaliação do N2. SLA de solução, SLA do backlog e P85 são apenas contexto.')));
  root.append(h('div',{class:'box'},h('h2',{},'N3 — proposta de IES para clientes prioritários'),
    h('p',{},'Quatro indicadores do painel oficial entram no IES N3. Os pesos abaixo são sugeridos para sua validação e totalizam 100%. O SLA de solução é relevante para os clientes com prazo contratual, mas deve ser analisado com cautela quando o chamado já chegou vencido.'),
    table([...N3_KEYS.map(k=>regra(k,c.n3Pesos[k],'N3',true)),...N3_CTX.map(k=>regra(k,0,'N3',false))]),
    h('div',{class:'note'},`Soma dos pesos pontuáveis do N3: ${(pesos(c.n3Pesos)*100).toFixed(0)}%. % SLA 1ª Resposta é opcional, aplicável aos chamados recebidos diretamente; sua coluna no Back4App é opcional. Não há medida oficial de contribuição do N3 a chamados ainda atribuídos ao N2.`)));
  root.append(h('div',{class:'box'},h('h2',{},'Exemplo de cálculo do IES N3'),
    h('p',{},'SLA Solução = 96%, SLA Backlog = 80%, CSAT = 95%, Reabertos = 3%.'),
    h('p',{},'Notas: SLA 96 pontos; SLA Backlog 75 pontos; CSAT 95 pontos; Reabertos 100 pontos.'),
    h('p',{},'IES N3 = (96 × 35%) + (75 × 25%) + (95 × 25%) + (100 × 15%) = 91,1 pontos.'),
    h('div',{class:'note'},'Exemplo ilustrativo de aplicação da proposta; não representa resultados da equipe.')));
  root.append(h('div',{class:'box'},h('h2',{},'Acumulado anual — todos os níveis'),
    h('p',{},'O ano é calculado automaticamente com os dados mensais lançados, sem gravar um lançamento ANO no banco.'),
    h('p',{},'Tickets fechados = soma dos meses informados; backlog de tickets = último volume mensal; percentuais, SLA e P85 = médias aritméticas dos meses com valor. As médias de percentuais não equivalem às taxas oficiais anuais calculadas a partir dos registros individuais.'),
    h('p',{},'O IES N3 anual aplica os pesos às médias mensais dos quatro indicadores. Se qualquer indicador estiver ausente no ano inteiro, o IES N3 anual permanece sem nota.')));
}

function render(){
  $('#tab-time').hidden = ui.tab!=='time'; $('#tab-analista').hidden = ui.tab!=='analista';
  $('#tab-lancar').hidden = ui.tab!=='lancar'; $('#tab-regras').hidden = ui.tab!=='regras';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===ui.tab));
  if(ui.tab==='time') renderTime(); else if(ui.tab==='analista') renderAnalista(); else if(ui.tab==='lancar') renderLancar(); else renderRegras();
}
function afterAuth(){
  const who=$('#who'), li=$('#loginBtn'), lo=$('#logoutBtn');
  who.hidden=!state.user; who.textContent=state.user?(state.user.get?state.user.get('username'):state.user.username):'';
  li.hidden = DEMO || !CONFIGURED || !!state.user; lo.hidden = DEMO || !CONFIGURED || !state.user;
  render();
}
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{ui.tab=b.dataset.tab;render();}));
$('#loginBtn').addEventListener('click',()=>$('#dlg').showModal());
$('#cancelLogin').addEventListener('click',()=>$('#dlg').close());
$('#logoutBtn').addEventListener('click',()=>logout());
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault(); const err=$('#loginErr'); err.hidden=true;
  try{ await login($('#em').value,$('#pw').value); $('#pw').value=''; $('#dlg').close(); }
  catch(x){ err.textContent='Não foi possível entrar: '+(x.message||x); err.hidden=false; }
});
window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>render());
render(); connect();
